<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ada's Fluffy Bites • Pancake Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --primary: #FF9F1C;
      --brown: #8B4513;
      --cream: #F5EDE3;
    }
    body { 
      background: #F5EDE3; 
      font-family: 'Segoe UI', sans-serif; 
    }
    .navbar { background: #8B4513 !important; }
    .card { 
      border: none; 
      border-radius: 20px; 
      box-shadow: 0 10px 30px rgba(139,69,19,0.15); 
      transition: all 0.3s; 
    }
    .card:hover { transform: translateY(-8px); }
    .btn-primary { 
      background: #FF9F1C; 
      border: none; 
    }
    .btn-primary:hover { background: #e88a00; }
    .cart-float { 
      position: fixed; 
      bottom: 20px; 
      right: 20px; 
      z-index: 1000; 
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="#">🥞 Ada's Fluffy Bites</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="#" onclick="showCart()">
              🛒 Cart <span id="cartBadge" class="badge bg-warning">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="display-4 text-center fw-bold text-brown mb-2">Good Morning, Sunshine! ☀️</h1>
    <p class="text-center mb-5 lead">Fresh, fluffy pancakes made with love</p>

    <!-- Limit Alert -->
    <div id="limitAlert" class="alert alert-warning text-center d-none"></div>

    <!-- Menu -->
    <div class="row" id="menuContainer"></div>
  </div>

  <!-- Floating Cart Button -->
  <button onclick="showCart()" class="cart-float btn btn-primary btn-lg rounded-circle shadow-lg">
    <i class="fa-solid fa-shopping-cart"></i>
    <span id="floatingTotal" class="ms-2">₦0</span>
  </button>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Your Cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartItems"></div>
        <div class="modal-footer flex-column">
          <div class="w-100 d-flex justify-content-between mb-3">
            <strong>Total</strong>
            <strong id="modalTotal">₦0</strong>
          </div>
          <button onclick="proceedToCheckout()" class="btn btn-primary w-100 py-3">Proceed to Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Checkout</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="checkoutForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" value="234" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Pickup or Delivery</label>
              <select class="form-select" id="deliveryType" onchange="toggleAddress()">
                <option value="Pickup">Pickup</option>
                <option value="Delivery">Delivery</option>
              </select>
            </div>
            <div class="mb-3" id="addressGroup" style="display:none;">
              <label class="form-label">Delivery Address</label>
              <textarea class="form-control" id="address" rows="2"></textarea>
            </div>
          </form>
          
          <!-- Real Payment Details -->
          <div class="mt-4 p-3 bg-light rounded">
            <h6>Bank Transfer Details</h6>
            <p><strong>Bank:</strong> Palmpay</p>
            <p><strong>Account Name:</strong> Princewill faith</p>
            <p><strong>Account Number:</strong> 8135014753</p>
            <small class="text-muted">Send proof of payment to our WhatsApp after placing order</small>
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="placeOrder()" class="btn btn-success w-100 py-3">Place Order & Open WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase & Bootstrap Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ================== YOUR FIREBASE CONFIG ==================
    const firebaseConfig = {
      apiKey: "AIzaSyDJhlVlCvOBJ5I5Cdss-l9-H3RUlOi2txY",
      authDomain: "adafluffybites.firebaseapp.com",
      projectId: "adafluffybites",
      storageBucket: "adafluffybites.firebasestorage.app",
      messagingSenderId: "507734690578",
      appId: "1:507734690578:web:9fef35e12c3bf5e92ac1cb",
      measurementId: "G-524DD03MKN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Menu Items
    const menuItems = [
      { id: 1, name: "Sunrise Stack", desc: "Fluffy pancakes with fresh berries & honey drizzle", price: 1600 },
      { id: 2, name: "Sizzling Stack", desc: "Hot chocolate sauce & banana pancakes", price: 1700 },
      { id: 3, name: "Classic Feast", desc: "Pancakes, eggs, bacon & syrup", price: 2300 },
      { id: 4, name: "Eggstravaganza", desc: "Loaded with scrambled eggs & sausages", price: 2500 },
      { id: 5, name: "Eggstravaganza + Drink", desc: "Full breakfast + chilled drink", price: 2700 },
      { id: 6, name: "Breakfast Deluxe + Fruit", desc: "Pancakes, eggs, fruits & yogurt", price: 3100 },
      { id: 7, name: "Breakfast Deluxe (Signature Combo)", desc: "Our most popular combo!", price: 3500 }
    ];

    let cart = [];

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function isMorning() {
      return new Date().getHours() < 12;
    }

    // Render Menu
    function renderMenu() {
      const container = document.getElementById("menuContainer");
      container.innerHTML = menuItems.map(item => `
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card h-100">
            <div class="card-body">
              <h5>${item.name}</h5>
              <p class="text-muted small">${item.desc}</p>
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="text-success">₦${item.price.toLocaleString()}</h5>
                <button onclick="addToCart(${item.id})" class="btn btn-primary btn-sm">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const item = menuItems.find(i => i.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) existing.quantity++;
      else cart.push({ ...item, quantity: 1 });
      updateCartUI();
      showToast(`${item.name} added! 🥞`);
    }

    function updateCartUI() {
      const totalItems = cart.reduce((a, c) => a + c.quantity, 0);
      const totalPrice = cart.reduce((a, c) => a + c.price * c.quantity, 0);
      document.getElementById("cartBadge").textContent = totalItems;
      document.getElementById("floatingTotal").innerHTML = `₦${totalPrice.toLocaleString()}`;
    }

    function showCart() {
      if (cart.length === 0) return alert("Cart is empty!");
      const html = cart.map((item, i) => `
        <div class="d-flex justify-content-between mb-3">
          <div>
            <strong>${item.name}</strong><br>
            <small>₦${item.price} × ${item.quantity}</small>
          </div>
          <div class="text-end">
            <strong>₦${(item.price * item.quantity).toLocaleString()}</strong><br>
            <button onclick="removeFromCart(${i})" class="btn btn-sm btn-outline-danger">Remove</button>
          </div>
        </div>
      `).join("");
      document.getElementById("cartItems").innerHTML = html || "<p class='text-center'>Cart is empty</p>";
      document.getElementById("modalTotal").textContent = `₦${cart.reduce((a,c)=>a+c.price*c.quantity,0).toLocaleString()}`;
      new bootstrap.Modal(document.getElementById("cartModal")).show();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      showCart();
    }

    function proceedToCheckout() {
      bootstrap.Modal.getInstance(document.getElementById("cartModal")).hide();
      new bootstrap.Modal(document.getElementById("checkoutModal")).show();
    }

    function toggleAddress() {
      const type = document.getElementById("deliveryType").value;
      document.getElementById("addressGroup").style.display = type === "Delivery" ? "block" : "none";
    }

    // Improved Place Order Function
    async function placeOrder() {
      console.log("🚀 Place Order button clicked - starting process...");

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      const name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const deliveryType = document.getElementById("deliveryType").value;
      const address = document.getElementById("address").value.trim();

      if (!name || !phone) {
        alert("Please enter your full name and phone number");
        return;
      }

      const today = getToday();
      const period = isMorning() ? "morning" : "evening";
      const limitRef = db.collection("dailyLimits").doc(today);
      
      try {
        console.log("Checking daily limits for " + today + " (" + period + ")...");

        const doc = await limitRef.get();
        const data = doc.exists ? doc.data() : { morningCount: 0, eveningCount: 0 };
        
        const currentCount = period === "morning" ? data.morningCount : data.eveningCount;
        if (currentCount >= 5) {
          return alert(`Sorry! ${period} orders are sold out for today 🥲`);
        }

        const total = cart.reduce((a, c) => a + c.price * c.quantity, 0);

        const orderData = {
          name,
          phone: phone.startsWith("234") ? phone : "234" + phone.replace(/^0+/, ''),
          items: cart,
          total,
          deliveryType,
          address: deliveryType === "Delivery" ? address : "Pickup",
          status: "pending",
          paid: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          period
        };

        console.log("Saving order to Firestore...");
        const orderRef = await db.collection("orders").add(orderData);
        console.log("✅ Order saved successfully! ID:", orderRef.id);

        // Update daily limit
        await limitRef.set({
          morningCount: firebase.firestore.FieldValue.increment(period === "morning" ? 1 : 0),
          eveningCount: firebase.firestore.FieldValue.increment(period === "evening" ? 1 : 0)
        }, { merge: true });

        console.log("✅ Daily limit updated. Opening WhatsApp...");

        const message = encodeURIComponent(
          `Hi Ada! 🥞\n\nNew order from ${name}\nPhone: ${phone}\nTotal: ₦${total.toLocaleString()}\nItems:\n` +
          cart.map(i => `• ${i.quantity}x ${i.name}`).join("\n") +
          `\n\nDelivery: ${deliveryType}`
        );
        
        window.location.href = `https://wa.me/2348135014753?text=${message}`;

        cart = [];
        updateCartUI();
        bootstrap.Modal.getInstance(document.getElementById("checkoutModal")).hide();

      } catch (e) {
        console.error("❌ ERROR placing order:", e);
        console.error("Error code:", e.code);
        console.error("Error message:", e.message);
        alert("Error placing order: " + (e.message || e.code || "Unknown error") + "\n\nCheck the browser console (F12) and send me the red error message.");
      }
    }

    function showToast(msg) {
      const toast = document.createElement("div");
      toast.className = "toast show position-fixed bottom-0 end-0 m-3 bg-success text-white";
      toast.innerHTML = `<div class="toast-body">${msg}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Real-time limit checker
    async function initLimits() {
      const today = getToday();
      const ref = db.collection("dailyLimits").doc(today);
      const snap = await ref.get();
      if (!snap.exists) {
        await ref.set({ morningCount: 0, eveningCount: 0 });
      }

      ref.onSnapshot(doc => {
        const data = doc.data() || { morningCount: 0, eveningCount: 0 };
        const morningLeft = 5 - data.morningCount;
        const eveningLeft = 5 - data.eveningCount;
        
        const alertEl = document.getElementById("limitAlert");
        const period = isMorning() ? "morning" : "evening";
        const left = period === "morning" ? morningLeft : eveningLeft;
        
        if (left <= 0) {
          alertEl.classList.remove("d-none");
          alertEl.innerHTML = `<strong>😢 ${period.toUpperCase()} ORDERS ARE SOLD OUT TODAY!</strong><br>Come back tomorrow or try the other period.`;
        } else {
          alertEl.classList.add("d-none");
        }
      });
    }

    // Initialize everything
    window.onload = () => {
      renderMenu();
      initLimits();
      updateCartUI();
    };
  </script>
</body>
</html>
