<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ada's Fluffy Bites • Pancake Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --primary: #FF9F1C; --brown: #8B4513; --cream: #F5EDE3; }
    body { background: #F5EDE3; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #8B4513 !important; }
    .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(139,69,19,0.15); transition: all 0.3s; }
    .card:hover { transform: translateY(-8px); }
    .btn-primary { background: #FF9F1C; border: none; }
    .btn-primary:hover { background: #e88a00; }
    .cart-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }

    /* Success Animation */
    .success-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center;
      z-index: 2000;
    }
    .success-box {
      background: white; color: #8B4513; padding: 40px; border-radius: 30px;
      text-align: center; max-width: 380px; animation: pop 0.6s ease;
    }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-icon { font-size: 80px; color: #28a745; }
  </style>
</head>
<body>
  <!-- Navigation, Menu, Cart, Checkout modals same as before... -->
  <!-- (I kept them short for space - use the same from previous version) -->

  <!-- Success Animation Overlay -->
  <div id="successOverlay" class="success-overlay">
    <div class="success-box">
      <div class="success-icon mb-3">✅</div>
      <h3 class="fw-bold">Order Placed Successfully!</h3>
      <p class="lead">Your fluffy bites are being prepared 🥞</p>
      <p class="small text-muted">Redirecting to WhatsApp...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJhlVlCvOBJ5I5Cdss-l9-H3RUlOi2txY",
      authDomain: "adafluffybites.firebaseapp.com",
      projectId: "adafluffybites",
      storageBucket: "adafluffybites.firebasestorage.app",
      messagingSenderId: "507734690578",
      appId: "1:507734690578:web:9fef35e12c3bf5e92ac1cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Menu items and cart logic same as before...

    // Improved placeOrder with animation
    async function placeOrder() {
      if (cart.length === 0) return alert("Cart is empty!");

      const name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const deliveryType = document.getElementById("deliveryType").value;
      const address = document.getElementById("address").value.trim();

      if (!name || !phone) return alert("Name and phone are required");

      const today = getToday();
      const period = isMorning() ? "morning" : "evening";
      const limitRef = db.collection("dailyLimits").doc(today);

      try {
        // Show loading / success animation immediately
        const overlay = document.getElementById("successOverlay");
        overlay.style.display = "flex";

        const total = cart.reduce((a,c) => a + c.price * c.quantity, 0);

        const orderData = {
          name, phone: "234" + phone.replace(/^0+/, ''), items: cart, total,
          deliveryType, address: deliveryType === "Delivery" ? address : "Pickup",
          status: "pending", paid: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          period
        };

        await db.collection("orders").add(orderData);

        await limitRef.set({
          morningCount: firebase.firestore.FieldValue.increment(period === "morning" ? 1 : 0),
          eveningCount: firebase.firestore.FieldValue.increment(period === "evening" ? 1 : 0)
        }, { merge: true });

        // Wait a moment for nice animation feel
        await new Promise(resolve => setTimeout(resolve, 1800));

        // Open WhatsApp
        const message = encodeURIComponent(`Hi Ada! 🥞\nNew order from ${name}\nPhone: ${phone}\nTotal: ₦${total.toLocaleString()}\nItems:\n${cart.map(i => `• ${i.quantity}x ${i.name}`).join("\n")}\nDelivery: ${deliveryType}`);
        window.location.href = `https://wa.me/2348135014753?text=${message}`;

        // Clear cart
        cart = [];
        updateCartUI();
        bootstrap.Modal.getInstance(document.getElementById("checkoutModal")).hide();

      } catch (e) {
        document.getElementById("successOverlay").style.display = "none";
        console.error("Error:", e);
        alert("Error: " + (e.message || "Unknown error") + "\n\nPlease send me the red message from browser console (F12).");
      }
    }

    // Rest of your functions (renderMenu, addToCart, etc.) remain the same
  </script>
</body>
</html>
