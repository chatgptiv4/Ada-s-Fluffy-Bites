<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ada's Fluffy Bites • Pancake Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #F5EDE3; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #8B4513 !important; }
    .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(139,69,19,0.15); transition: all 0.3s; }
    .card:hover { transform: translateY(-8px); }
    .btn-primary { background: #FF9F1C; border: none; }
    .btn-primary:hover { background: #e88a00; }
    .cart-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }

    .success-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 3000;
    }
    .success-box {
      background: white; color: #8B4513; padding: 50px; border-radius: 30px; text-align: center;
      animation: pop 0.6s ease;
    }
    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold fs-3" href="#">🥞 Ada's Fluffy Bites</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" onclick="showCart()" style="cursor:pointer">
              🛒 Cart <span id="cartBadge" class="badge bg-warning">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="display-4 text-center fw-bold text-brown mb-2">Good Morning, Sunshine! ☀️</h1>
    <p class="text-center mb-5 lead">Fresh, fluffy pancakes made with love</p>

    <div id="limitAlert" class="alert alert-warning text-center d-none"></div>
    <div class="row" id="menuContainer"></div>
  </div>

  <button onclick="showCart()" class="cart-float btn btn-primary btn-lg rounded-circle shadow-lg">
    <i class="fa-solid fa-shopping-cart"></i> <span id="floatingTotal" class="ms-2">₦0</span>
  </button>

  <!-- Cart Modal -->
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Your Cart</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cartItems"></div>
        <div class="modal-footer flex-column">
          <div class="w-100 d-flex justify-content-between mb-3 fs-5">
            <strong>Total</strong>
            <strong id="modalTotal">₦0</strong>
          </div>
          <button onclick="proceedToCheckout()" class="btn btn-primary w-100 py-3">Proceed to Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5>Checkout</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="text" id="fullName" class="form-control mb-3" placeholder="Full Name" required>
          <input type="tel" id="phone" class="form-control mb-3" value="234" placeholder="Phone Number" required>
          <select id="deliveryType" class="form-select mb-3" onchange="toggleAddress()">
            <option value="Pickup">Pickup</option>
            <option value="Delivery">Delivery</option>
          </select>
          <div id="addressGroup" style="display:none;">
            <textarea id="address" class="form-control" rows="2" placeholder="Delivery Address"></textarea>
          </div>
          <div class="p-3 bg-light rounded mt-3">
            <h6>Palmpay</h6>
            <p><strong>Account Name:</strong> Princewill faith</p>
            <p><strong>Account Number:</strong> 8135014753</p>
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="placeOrder()" class="btn btn-success w-100 py-3">Place Order & Open WhatsApp</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Success Animation -->
  <div id="successOverlay" class="success-overlay">
    <div class="success-box">
      <div style="font-size:80px; color:#28a745;">✅</div>
      <h3 class="fw-bold">Order Placed Successfully!</h3>
      <p>Your fluffy bites are being prepared 🥞</p>
      <p class="small text-muted">Redirecting to WhatsApp...</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJhlVlCvOBJ5I5Cdss-l9-H3RUlOi2txY",
      authDomain: "adafluffybites.firebaseapp.com",
      projectId: "adafluffybites",
      storageBucket: "adafluffybites.firebasestorage.app",
      messagingSenderId: "507734690578",
      appId: "1:507734690578:web:9fef35e12c3bf5e92ac1cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const menuItems = [
      { id: 1, name: "Sunrise Stack", desc: "Fluffy pancakes with fresh berries & honey drizzle", price: 1600 },
      { id: 2, name: "Sizzling Stack", desc: "Hot chocolate sauce & banana pancakes", price: 1700 },
      { id: 3, name: "Classic Feast", desc: "Pancakes, eggs, bacon & syrup", price: 2300 },
      { id: 4, name: "Eggstravaganza", desc: "Loaded with scrambled eggs & sausages", price: 2500 },
      { id: 5, name: "Eggstravaganza + Drink", desc: "Full breakfast + chilled drink", price: 2700 },
      { id: 6, name: "Breakfast Deluxe + Fruit", desc: "Pancakes, eggs, fruits & yogurt", price: 3100 },
      { id: 7, name: "Breakfast Deluxe (Signature Combo)", desc: "Our most popular combo!", price: 3500 }
    ];

    let cart = [];

    function renderMenu() {
      document.getElementById("menuContainer").innerHTML = menuItems.map(item => `
        <div class="col-md-6 col-lg-4 mb-4">
          <div class="card h-100">
            <div class="card-body">
              <h5>${item.name}</h5>
              <p class="text-muted small">${item.desc}</p>
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="text-success">₦${item.price.toLocaleString()}</h5>
                <button onclick="addToCart(${item.id})" class="btn btn-primary btn-sm px-4">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = menuItems.find(i => i.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.quantity++;
      } else {
        cart.push({ ...item, quantity: 1 });
      }

      updateCartUI();
      showToast(`${item.name} added! 🥞`);
      console.log(`Added to cart: ${item.name} | Cart now:`, cart);
    }

    function updateCartUI() {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      document.getElementById("cartBadge").textContent = totalItems;
      document.getElementById("floatingTotal").textContent = `₦${totalPrice.toLocaleString()}`;
    }

    function showCart() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let html = cart.map((item, index) => `
        <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
          <div>
            <strong>${item.name}</strong><br>
            <small>₦${item.price} × ${item.quantity}</small>
          </div>
          <div class="text-end">
            <strong>₦${(item.price * item.quantity).toLocaleString()}</strong><br>
            <button onclick="removeFromCart(${index}); event.stopImmediatePropagation();" class="btn btn-sm btn-danger mt-1">Remove</button>
          </div>
        </div>
      `).join('');

      document.getElementById("cartItems").innerHTML = html;
      document.getElementById("modalTotal").textContent = `₦${cart.reduce((sum, item) => sum + item.price * item.quantity, 0).toLocaleString()}`;

      new bootstrap.Modal(document.getElementById("cartModal")).show();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
      showCart();
    }

    function proceedToCheckout() {
      bootstrap.Modal.getInstance(document.getElementById("cartModal")).hide();
      new bootstrap.Modal(document.getElementById("checkoutModal")).show();
    }

    function toggleAddress() {
      document.getElementById("addressGroup").style.display = 
        (document.getElementById("deliveryType").value === "Delivery") ? "block" : "none";
    }

    async function placeOrder() {
      if (cart.length === 0) return alert("Cart is empty!");

      const name = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const deliveryType = document.getElementById("deliveryType").value;
      const address = document.getElementById("address").value.trim();

      if (!name || !phone) return alert("Please enter name and phone");

      document.getElementById("successOverlay").style.display = "flex";

      try {
        const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

        const orderData = {
          name,
          phone: "234" + phone.replace(/^0+/, ''),
          items: cart,
          total,
          deliveryType,
          address: deliveryType === "Delivery" ? address : "Pickup",
          status: "pending",
          paid: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("orders").add(orderData);

        await new Promise(r => setTimeout(r, 2000));

        const message = encodeURIComponent(`Hi Ada! 🥞\nNew order from ${name}\nPhone: ${phone}\nTotal: ₦${total.toLocaleString()}\nItems:\n${cart.map(i => `• ${i.quantity}x ${i.name}`).join("\n")}\nDelivery: ${deliveryType}`);

        window.location.href = `https://wa.me/2348135014753?text=${message}`;

        cart = [];
        updateCartUI();
        bootstrap.Modal.getInstance(document.getElementById("checkoutModal")).hide();

      } catch (e) {
        document.getElementById("successOverlay").style.display = "none";
        console.error(e);
        alert("Error: " + (e.message || "Please check console"));
      }
    }

    function showToast(msg) {
      const toast = document.createElement("div");
      toast.className = "toast show position-fixed bottom-0 end-0 m-3 bg-success text-white";
      toast.innerHTML = `<div class="toast-body">${msg}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    // Initialize
    window.onload = () => {
      renderMenu();
      updateCartUI();
      console.log("✅ Page fully loaded - Add to Cart should work properly");
    };
  </script>
</body>
</html>
