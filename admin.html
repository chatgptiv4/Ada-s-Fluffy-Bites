<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Ada's Fluffy Bites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #F5EDE3; }
    .dashboard-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(139,69,19,0.15); }
  </style>
</head>
<body>
  <div class="container py-4">
    <!-- Login Screen -->
    <div id="loginScreen">
      <h2 class="text-center mb-4">Admin Login - Ada's Fluffy Bites</h2>
      <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
          <input id="email" type="email" class="form-control mb-3" placeholder="Admin email" value="admin@adasfluffybites.com">
          <input id="password" type="password" class="form-control mb-3" placeholder="Password (min 6 characters)">
          <button onclick="login()" class="btn btn-primary w-100 py-3">Login as Admin</button>
          <small class="text-muted d-block text-center mt-3">
            First time? Just enter any email + password. It will create the admin account.
          </small>
        </div>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🥞 Admin Dashboard</h1>
        <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-3">
          <div class="dashboard-card p-4 text-center">
            <h5>Today's Orders</h5>
            <h2 id="totalOrders">0</h2>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dashboard-card p-4 text-center">
            <h5>Revenue (Paid)</h5>
            <h2 id="revenue">₦0</h2>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dashboard-card p-4 text-center">
            <h5>Morning Slots Left</h5>
            <h2 id="morningLeft">5</h2>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dashboard-card p-4 text-center">
            <h5>Evening Slots Left</h5>
            <h2 id="eveningLeft">5</h2>
          </div>
        </div>
      </div>

      <h5 class="mb-3">Live Orders</h5>
      <div id="ordersTable" class="table-responsive"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ================== NEW FIREBASE CONFIG (Updated) ==================
    const firebaseConfig = {
      apiKey: "AIzaSyDJhlVlCvOBJ5I5Cdss-l9-H3RUlOi2txY",
      authDomain: "adafluffybites.firebaseapp.com",
      projectId: "adafluffybites",
      storageBucket: "adafluffybites.firebasestorage.app",
      messagingSenderId: "507734690578",
      appId: "1:507734690578:web:9fef35e12c3bf5e92ac1cb",
      measurementId: "G-524DD03MKN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password");
        return;
      }

      try {
        await auth.signInWithEmailAndPassword(email, password);
        currentUser = auth.currentUser;
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
        alert("✅ Login successful! Welcome to Admin Dashboard.");
      } catch (e) {
        if (e.code === "auth/user-not-found" || e.code === "auth/invalid-credential") {
          // Auto-create admin account on first try
          try {
            await auth.createUserWithEmailAndPassword(email, password);
            alert("✅ New admin account created! Logging you in...");
            await login(); // Retry login after creation
          } catch (createError) {
            alert("Failed to create account: " + createError.message);
          }
        } else {
          alert("Login failed: " + e.message);
        }
      }
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function loadDashboard() {
      // Real-time orders listener
      db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        let html = `
          <table class="table table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Paid</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>`;

        let totalOrders = 0;
        let revenue = 0;

        snapshot.forEach(doc => {
          const o = doc.data();
          totalOrders++;
          if (o.status === "confirmed" && o.paid) revenue += o.total || 0;

          html += `
            <tr>
              <td><strong>${o.name}</strong><br><small>${o.phone}</small></td>
              <td>${o.items ? o.items.map(i => `${i.quantity}x ${i.name}`).join("<br>") : 'N/A'}</td>
              <td>₦${(o.total || 0).toLocaleString()}</td>
              <td>
                <span class="badge ${o.status==='confirmed' ? 'bg-success' : o.status==='declined' ? 'bg-danger' : 'bg-warning'}">
                  ${o.status || 'pending'}
                </span>
              </td>
              <td>${o.paid ? '✅ Paid' : '⏳ Pending'}</td>
              <td>
                <button onclick="confirmOrder('${doc.id}')" class="btn btn-sm btn-success me-1">✅ Confirm</button>
                <button onclick="declineOrder('${doc.id}')" class="btn btn-sm btn-danger me-1">❌ Decline</button>
                <button onclick="markPaid('${doc.id}', ${!o.paid})" class="btn btn-sm btn-info">${o.paid ? 'Undo' : '💰 Mark Paid'}</button>
              </td>
            </tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById("ordersTable").innerHTML = html || "<p class='text-center text-muted'>No orders yet.</p>";
        
        document.getElementById("totalOrders").textContent = totalOrders;
        document.getElementById("revenue").textContent = `₦${revenue.toLocaleString()}`;
      });

      // Real-time daily limits
      const today = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
      db.collection("dailyLimits").doc(today).onSnapshot(doc => {
        const d = doc.data() || { morningCount: 0, eveningCount: 0 };
        document.getElementById("morningLeft").textContent = 5 - d.morningCount;
        document.getElementById("eveningLeft").textContent = 5 - d.eveningCount;
      });
    }

    async function confirmOrder(id) {
      try {
        await db.collection("orders").doc(id).update({ status: "confirmed" });
        const orderSnap = await db.collection("orders").doc(id).get();
        const order = orderSnap.data();
        const msg = encodeURIComponent(`Hello ${order.name}, your order has been confirmed ✅\nTotal: ₦${order.total}\nEnjoy your fluffy bites! 🥞`);
        window.open(`https://wa.me/${order.phone}?text=${msg}`, "_blank");
        playNotificationSound();
      } catch (e) {
        alert("Failed to confirm: " + e.message);
      }
    }

    async function declineOrder(id) {
      if (confirm("Decline this order?")) {
        await db.collection("orders").doc(id).update({ status: "declined" });
      }
    }

    async function markPaid(id, paid) {
      await db.collection("orders").doc(id).update({ paid: paid });
    }

    function playNotificationSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(800, ctx.currentTime);
      oscillator.connect(ctx.destination);
      oscillator.start();
      setTimeout(() => oscillator.stop(), 300);
    }

    // Auto check if already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
      }
    });
  </script>
</body>
</html>
