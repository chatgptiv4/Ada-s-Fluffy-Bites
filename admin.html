<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Ada's Fluffy Bites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #F5EDE3; }
    .dashboard-card { background: white; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div id="loginScreen">
      <h2 class="text-center mb-4">Admin Login</h2>
      <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
          <input id="email" type="email" class="form-control mb-3" placeholder="Admin email" value="admin@adasfluffybites.com">
          <input id="password" type="password" class="form-control mb-3" placeholder="Password">
          <button onclick="login()" class="btn btn-primary w-100">Login as Admin</button>
        </div>
      </div>
    </div>

    <div id="dashboardScreen" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🥞 Admin Dashboard</h1>
        <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Today's Orders</h5><h2 id="totalOrders">0</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Revenue (Paid)</h5><h2 id="revenue">₦0</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Morning Slots Left</h5><h2 id="morningLeft">5</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Evening Slots Left</h5><h2 id="eveningLeft">5</h2></div></div>
      </div>

      <h5 class="mb-3">Live Orders</h5>
      <div id="ordersTable" class="table-responsive"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ================== YOUR FIREBASE CONFIG (ALREADY INSERTED) ==================
    const firebaseConfig = {
      apiKey: "AIzaSyDjK7fXXfHmZvUXOeVj4ghPkph9zzt3CcQ",
      authDomain: "studio-5382809495-af989.firebaseapp.com",
      projectId: "studio-5382809495-af989",
      storageBucket: "studio-5382809495-af989.firebasestorage.app",
      messagingSenderId: "845098988973",
      appId: "1:845098988973:web:9bc13059d521beac99dd24"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        currentUser = auth.currentUser;
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
      } catch (e) {
        if (e.code === "auth/user-not-found") {
          await auth.createUserWithEmailAndPassword(email, password);
          alert("Admin account created! Logging in...");
          await login();
        } else {
          alert("Login failed: " + e.message);
        }
      }
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function loadDashboard() {
      db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        let html = `<table class="table table-hover"><thead><tr><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Paid</th><th>Actions</th></tr></thead><tbody>`;
        
        let totalOrders = 0;
        let revenue = 0;

        snapshot.forEach(doc => {
          const o = doc.data();
          totalOrders++;
          if (o.status === "confirmed" && o.paid) revenue += o.total;

          html += `
            <tr>
              <td><strong>${o.name}</strong><br><small>${o.phone}</small></td>
              <td>${o.items.map(i=>`${i.quantity}x ${i.name}`).join("<br>")}</td>
              <td>₦${o.total.toLocaleString()}</td>
              <td><span class="badge ${o.status==='confirmed'?'bg-success':o.status==='declined'?'bg-danger':'bg-warning'}">${o.status}</span></td>
              <td>${o.paid ? '✅ Paid' : '⏳ Pending'}</td>
              <td>
                <button onclick="confirmOrder('${doc.id}')" class="btn btn-sm btn-success me-1">✅ Confirm</button>
                <button onclick="declineOrder('${doc.id}')" class="btn btn-sm btn-danger me-1">❌ Decline</button>
                <button onclick="markPaid('${doc.id}', ${!o.paid})" class="btn btn-sm btn-info">${o.paid ? 'Undo Paid' : '💰 Mark Paid'}</button>
              </td>
            </tr>`;
        });
        
        html += `</tbody></table>`;
        document.getElementById("ordersTable").innerHTML = html || "<p>No orders yet.</p>";
        
        document.getElementById("totalOrders").textContent = totalOrders;
        document.getElementById("revenue").textContent = `₦${revenue.toLocaleString()}`;
      });

      const today = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
      db.collection("dailyLimits").doc(today).onSnapshot(doc => {
        const d = doc.data() || { morningCount: 0, eveningCount: 0 };
        document.getElementById("morningLeft").textContent = 5 - d.morningCount;
        document.getElementById("eveningLeft").textContent = 5 - d.eveningCount;
      });
    }

    async function confirmOrder(id) {
      await db.collection("orders").doc(id).update({ status: "confirmed" });
      const order = (await db.collection("orders").doc(id).get()).data();
      const msg = encodeURIComponent(`Hello ${order.name}, your order has been confirmed ✅\nTotal: ₦${order.total}\nWe can't wait for you to enjoy your fluffy bites! 🥞`);
      window.open(`https://wa.me/${order.phone}?text=${msg}`, "_blank");
      playNotificationSound();
    }

    async function declineOrder(id) {
      if (confirm("Decline this order?")) {
        await db.collection("orders").doc(id).update({ status: "declined" });
      }
    }

    async function markPaid(id, paid) {
      await db.collection("orders").doc(id).update({ paid });
    }

    function playNotificationSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(800, ctx.currentTime);
      oscillator.connect(ctx.destination);
      oscillator.start();
      setTimeout(() => oscillator.stop(), 300);
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
      }
    });
  </script>
</body>
</html>
