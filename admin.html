<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin • Ada's Fluffy Bites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: #F5EDE3; }
    .dashboard-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(139,69,19,0.15); }
    .table th { background: #8B4513; color: white; }
    .btn-reset { background: #dc3545; color: white; }
    .btn-reset:hover { background: #c82333; }
  </style>
</head>
<body>
  <div class="container py-4">
    <!-- Login Screen -->
    <div id="loginScreen">
      <h2 class="text-center mb-4">Admin Login - Ada's Fluffy Bites</h2>
      <div class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
          <input id="email" type="email" class="form-control mb-3" placeholder="Admin email" value="admin@adasfluffybites.com">
          <input id="password" type="password" class="form-control mb-3" placeholder="Password">
          <button onclick="login()" class="btn btn-primary w-100 py-3">Login as Admin</button>
        </div>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">🥞 Admin Dashboard</h1>
        <div>
          <button onclick="manualReset()" class="btn btn-reset me-2">🔄 Reset Today's Slots</button>
          <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
        </div>
      </div>

      <div class="row g-4 mb-5">
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Today's Orders</h5><h2 id="totalOrders">0</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Revenue (Paid)</h5><h2 id="revenue">₦0</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Morning Left</h5><h2 id="morningLeft">5</h2></div></div>
        <div class="col-md-3"><div class="dashboard-card p-4 text-center"><h5>Evening Left</h5><h2 id="eveningLeft">5</h2></div></div>
      </div>

      <h5 class="mb-3">Live Orders</h5>
      <div id="ordersTable" class="table-responsive"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJhlVlCvOBJ5I5Cdss-l9-H3RUlOi2txY",
      authDomain: "adafluffybites.firebaseapp.com",
      projectId: "adafluffybites",
      storageBucket: "adafluffybites.firebasestorage.app",
      messagingSenderId: "507734690578",
      appId: "1:507734690578:web:9fef35e12c3bf5e92ac1cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
      } catch (e) {
        if (e.code === "auth/user-not-found") {
          await auth.createUserWithEmailAndPassword(email, password);
          alert("Admin account created!");
          login();
        } else {
          alert("Login failed: " + e.message);
        }
      }
    }

    function logout() {
      auth.signOut();
      location.reload();
    }

    function getToday() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadDashboard() {
      // Real-time orders
      db.collection("orders").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        let html = `<table class="table table-hover"><thead class="table-dark"><tr><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Paid</th><th>Actions</th></tr></thead><tbody>`;
        let totalOrders = 0, revenue = 0;

        snapshot.forEach(doc => {
          const o = doc.data();
          totalOrders++;
          if (o.status === "confirmed" && o.paid) revenue += o.total || 0;

          html += `
            <tr>
              <td><strong>${o.name}</strong><br><small>${o.phone}</small></td>
              <td>${o.items ? o.items.map(i => `${i.quantity}x ${i.name}`).join("<br>") : 'N/A'}</td>
              <td>₦${(o.total || 0).toLocaleString()}</td>
              <td><span class="badge ${o.status==='confirmed' ? 'bg-success' : o.status==='declined' ? 'bg-danger' : 'bg-warning'}">${o.status || 'pending'}</span></td>
              <td>${o.paid ? '✅ Paid' : '⏳ Pending'}</td>
              <td>
                <button onclick="confirmOrder('${doc.id}')" class="btn btn-sm btn-success me-1">✅ Confirm</button>
                <button onclick="declineOrder('${doc.id}')" class="btn btn-sm btn-danger me-1">❌ Decline</button>
                <button onclick="markPaid('${doc.id}', ${!o.paid})" class="btn btn-sm btn-info me-1">${o.paid ? 'Undo' : '💰 Paid'}</button>
                <button onclick="deleteOrder('${doc.id}')" class="btn btn-sm btn-outline-danger">🗑️ Delete</button>
              </td>
            </tr>`;
        });

        html += `</tbody></table>`;
        document.getElementById("ordersTable").innerHTML = html || "<p class='text-center'>No orders yet.</p>";
        document.getElementById("totalOrders").textContent = totalOrders;
        document.getElementById("revenue").textContent = `₦${revenue.toLocaleString()}`;
      });

      // Real-time limits
      const today = getToday();
      const limitRef = db.collection("dailyLimits").doc(today);

      limitRef.onSnapshot(doc => {
        const d = doc.data() || { morningCount: 0, eveningCount: 0 };
        document.getElementById("morningLeft").textContent = 5 - d.morningCount;
        document.getElementById("eveningLeft").textContent = 5 - d.eveningCount;
      });
    }

    async function confirmOrder(id) { await db.collection("orders").doc(id).update({ status: "confirmed" }); }
    async function declineOrder(id) {
      if (confirm("Decline this order?")) await db.collection("orders").doc(id).update({ status: "declined" });
    }
    async function markPaid(id, paid) {
      await db.collection("orders").doc(id).update({ paid });
    }

    // Delete Order + Free Slot
    async function deleteOrder(id) {
      if (!confirm("Delete this order and free the slot?")) return;

      try {
        const orderSnap = await db.collection("orders").doc(id).get();
        if (!orderSnap.exists) return;

        const order = orderSnap.data();
        const orderDate = order.timestamp.toDate();
        const todayStr = `${orderDate.getFullYear()}-${String(orderDate.getMonth()+1).padStart(2,'0')}-${String(orderDate.getDate()).padStart(2,'0')}`;
        const period = order.period || (orderDate.getHours() < 12 ? "morning" : "evening");

        const batch = db.batch();
        batch.delete(db.collection("orders").doc(id));

        const limitRef = db.collection("dailyLimits").doc(todayStr);
        batch.update(limitRef, {
          morningCount: firebase.firestore.FieldValue.increment(period === "morning" ? -1 : 0),
          eveningCount: firebase.firestore.FieldValue.increment(period === "evening" ? -1 : 0)
        });

        await batch.commit();
      } catch (e) {
        console.error(e);
        alert("Failed to delete order.");
      }
    }

    // NEW: Manual Reset Button - Resets Today's Slots
    async function manualReset() {
      if (!confirm("⚠️ Reset today's order slots?\n\nThis will allow 5 new morning and 5 new evening orders.\n\nAre you sure?")) {
        return;
      }

      try {
        const today = getToday();
        const limitRef = db.collection("dailyLimits").doc(today);

        await limitRef.set({
          morningCount: 0,
          eveningCount: 0
        });

        alert("✅ Today's slots have been reset successfully!\nYou can now accept fresh orders.");
      } catch (e) {
        console.error(e);
        alert("Failed to reset slots. Please try again.");
      }
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById("loginScreen").classList.add("d-none");
        document.getElementById("dashboardScreen").classList.remove("d-none");
        loadDashboard();
      }
    });
  </script>
</body>
</html>
